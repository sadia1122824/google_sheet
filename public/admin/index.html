<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Google Sheet inicio de sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- App favicon -->
    <link rel="shortcut icon" href="../admin/assets/images/favicon.ico">

    <!-- App css -->
    <link href="../admin/assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="../admin/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <link href="../admin/assets/css/app.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @media (max-width: 576px) {
            .col-lg-5 {
                padding: 0 0.75rem;
            }

            .card {
                margin: 0.5rem;
            }

            .card-body {
                padding: 1rem !important;
            }

            .auth-header-box .p-3 {
                padding: 1rem !important;
            }

            .btn-block {
                font-size: 0.9rem;
                padding: 0.6rem;
            }

            .form-control {
                font-size: 16px;
                /* iOS zoom prevent karta hai */
            }
        }

        /* account-social fix */
        .account-social h6 {
            display: flex;
            align-items: center;
            gap: .75rem;
            font-size: .85rem;
            color: #888;
            font-weight: 400;
            text-align: center;
        }

        .account-social h6::before,
        .account-social h6::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dee2e6;
        }
    </style>

</head>

<body class="account-body accountbg">

    <!-- Página de inicio de sesión (Admin + Staff) -->
    <div class="container">
        <div class="row vh-100 d-flex justify-content-center">
            <div class="col-12 align-self-center">
                <div class="row">
                    <div class="col-lg-5 mx-auto">
                        <div class="card">
                            <div class="card-body p-0 auth-header-box">
                                <div class="text-center p-3">
                                    <a href="/login" class="logo logo-admin">
                                        <img src="../admin/assets/images/logo-sm-dark.png" height="50" alt="logo"
                                            class="auth-logo">
                                    </a>
                                    <h4 class="mt-3 mb-1 font-weight-semibold text-white font-18">Comencemos
                                    </h4>
                                    <p class="text-muted  mb-0">Inicia sesión para continuar al panel de Google Sheet.</p>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <ul class="nav-border nav nav-pills" role="tablist">
                                    <li class="nav-item">
                                        <a class="nav-link active font-weight-semibold" data-toggle="tab"
                                            href="#LogIn_Tab" role="tab">Iniciar Sesión</a>
                                    </li>
                                </ul>

                                <div class="tab-content">
                                    <div class="tab-pane active p-3" id="LogIn_Tab" role="tabpanel">
                                        <form class="form-horizontal auth-form" id="loginForm" autocomplete="on" novalidate>

                                            <div class="form-group mb-2">
                                                <label for="useremail">Correo electrónico o ID de personal</label>
                                                <div class="input-group">
                                                    <input type="text" class="form-control" name="username"
                                                        id="useremail" autocomplete="username"
                                                        placeholder="Ingresa tu correo electrónico o ID">
                                                </div>
                                            </div><!--end form-group-->

                                            <div class="form-group mb-2">
                                                <label for="userpassword">Contraseña</label>
                                                <div class="input-group">
                                                    <input type="password" class="form-control" name="password"
                                                        id="userpassword" autocomplete="current-password"
                                                        placeholder="Ingresa tu contraseña">
                                                </div>
                                            </div><!--end form-group-->

                                            <div class="form-group row my-3">
                                                <div class="col-sm-6"></div>
                                            </div><!--end form-group-->

                                            <div class="form-group mb-0 row">
                                                <div class="col-12">
                                                    <button id="submitBtn"
                                                        class="btn btn-primary btn-block waves-effect waves-light"
                                                        type="submit">Iniciar Sesión <i
                                                            class="fas fa-sign-in-alt ml-1"></i></button>
                                                </div><!--end col-->
                                            </div> <!--end form-group-->
                                        </form><!--end form-->

                                        <div class="m-3 text-center text-muted"></div>
                                        <div class="account-social">
                                            <h6 class="mb-3">O inicia sesión con</h6>
                                        </div>
                                    </div>
                                </div>
                            </div><!--end card-body-->

                        </div><!--end card-->
                    </div><!--end col-->
                </div><!--end row-->
            </div><!--end col-->
        </div><!--end row-->
    </div><!--end container-->
    <!-- Fin de la página de inicio de sesión -->


    <!-- jQuery  -->
    <script src="../admin/assets/js/jquery.min.js"></script>
    <script src="../admin/assets/js/bootstrap.bundle.min.js"></script>
    <script src="../admin/assets/js/waves.js"></script>
    <script src="../admin/assets/js/feather.min.js"></script>
    <script src="../admin/assets/js/simplebar.min.js"></script>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('useremail');
        const passInput = document.getElementById('userpassword');
        const btn = document.getElementById('submitBtn');

        // Función SweetAlert con callback opcional
        function sweetAlert(icon, title, callback) {
            Swal.fire({
                icon,
                title,
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000,
                timerProgressBar: true,
                didClose: () => {
                    if (callback) callback();
                }
            });
        }

        // Login (admin + staff) - Enter key bhi chalega (type="submit")
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const data = {
                useremail: emailInput.value.trim(),
                userpassword: passInput.value.trim()
            };

            if (!data.useremail || !data.userpassword) {
                sweetAlert('warning', 'Por favor completa todos los campos');
                return;
            }

            btn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(data),
                });
                const response = await res.json();

                if (response.success) {
                    // Purane staff login ki tarah data save karo.
                    // Keys wahi rakho jo staff_dashboard.html padhta hai.
                    localStorage.setItem('role', response.role);
                    localStorage.setItem('user', JSON.stringify(response.user));

                    sweetAlert('success', response.message, () => {
                        window.location.href = response.redirect || '/';
                    });
                } else {
                    passInput.value = '';
                    sweetAlert('error', response.message);
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('Error de fetch:', err);
                sweetAlert('error', 'Algo salió mal');
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
