<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación OTP</title>
<style>
  :root {
    --navy: #0e2347;
    --blue: #1a63ff;
    --blue-dark: #0f52e0;
    --text: #2b3a5c;
    --muted: #6b7a99;
    --line: #e3e9f3;
    --bg: #f4f7fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* soft background shapes */
  .bg-shape { position: fixed; pointer-events: none; z-index: 0; }
  .bg-diamond {
    width: 520px; height: 520px;
    background: linear-gradient(135deg, rgba(210,220,238,.55), rgba(244,247,251,0));
    transform: rotate(45deg);
    border-radius: 24px;
  }
  .d1 { left: -330px; top: -160px; }
  .d2 { left: -240px; top: 170px; opacity: .8; }
  .d3 { left: -300px; top: 480px; opacity: .7; }
  .bg-ring {
    border: 1.5px solid rgba(205,215,232,.6);
    border-radius: 50%;
  }
  .r1 { width: 250px; height: 250px; right: 70px; top: -190px; }
  .r2 { width: 180px; height: 180px; right: 105px; top: -150px; }
  .bg-hex {
    right: -60px; bottom: -80px;
    width: 300px; height: 300px;
    border: 14px solid rgba(215,224,240,.55);
    transform: rotate(18deg);
    border-radius: 18px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 10px 34px rgba(24, 45, 90, .10);
    overflow: hidden;
  }

  /* header */
  .head {
    background: var(--navy);
    color: #fff;
    text-align: center;
    padding: 18px 20px 22px;
  }
  .head svg { width: 80px; height: 56px; display: block; margin: 0 auto 6px; }
  .head h1 { font-size: 20px; font-weight: 700; letter-spacing: .1px; }
  .head p { margin-top: 6px; font-size: 12.5px; color: #c5d0e6; }

  /* tab */
  .tabs { border-bottom: 1px solid var(--line); padding: 0 8px; }
  .tab {
    display: inline-block;
    padding: 12px 14px 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--blue);
    border-bottom: 2px solid var(--blue);
    margin-bottom: -1px;
  }

  /* body */
  .body { padding: 20px 24px 20px; text-align: center; }
  .lead { font-size: 14.5px; color: var(--text); }

  .otp {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin: 16px 0 18px;
  }
  .otp input {
    width: 46px; height: 52px;
    border: 1.5px solid #cfdaf0;
    border-radius: 8px;
    background: #fff;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    caret-color: var(--navy);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .otp input:focus {
    border-color: #8fb0f5;
    box-shadow: 0 0 0 4px rgba(26, 99, 255, .14);
  }
  .otp input.filled { border-color: #9dbaf2; }
  .otp.error input { border-color: #e5484d; box-shadow: 0 0 0 3px rgba(229,72,77,.12); }
  .otp.shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .msg { min-height: 16px; margin: -8px 0 8px; font-size: 13px; }
  .msg.err { color: #d03a3f; }
  .msg.ok { color: #1f8f55; }

  .btn {
    width: 100%;
    height: 44px;
    border: 0;
    border-radius: 4px;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s, opacity .15s;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn svg { width: 20px; height: 20px; }

  .resend { margin-top: 16px; font-size: 13.5px; color: var(--text); }
  .resend button {
    background: none; border: 0;
    font: inherit; font-weight: 600;
    color: var(--blue);
    cursor: pointer;
    margin-left: 6px;
  }
  .resend button:disabled { color: #9db4e6; cursor: not-allowed; }

  .timer {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .timer::before, .timer::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .timer span { display: inline-flex; align-items: center; gap: 8px; }
  .timer svg { width: 16px; height: 16px; }

  .otp input:focus-visible, .btn:focus-visible, .resend button:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }

  @media (max-width: 560px) {
    .body { padding: 18px 16px; }
    .otp { gap: 6px; }
    .otp input { width: 40px; height: 48px; font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .otp.shake { animation: none; } }
</style>
</head>
<body>
  <div class="bg-shape bg-diamond d1"></div>
  <div class="bg-shape bg-diamond d2"></div>
  <div class="bg-shape bg-diamond d3"></div>
  <div class="bg-shape bg-ring r1"></div>
  <div class="bg-shape bg-ring r2"></div>
  <div class="bg-shape bg-hex"></div>

  <main class="card">
    <header class="head">
      <svg viewBox="0 0 124 86" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2d8cff"/>
            <stop offset="1" stop-color="#0a56e8"/>
          </linearGradient>
        </defs>
        <path d="M6 66c14 14 46 14 78-14" stroke="#1a7bff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <path d="M110 22c6 6 6 14-6 22" stroke="#1a7bff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <path d="M62 4 28 16v26c0 20 14 33 34 41 20-8 34-21 34-41V16L62 4Z" fill="url(#sh)"/>
        <path d="M62 4 28 16v26c0 20 14 33 34 41V4Z" fill="#fff" opacity=".08"/>
        <rect x="48" y="40" width="28" height="22" rx="4" fill="#fff"/>
        <path d="M53 40v-6a9 9 0 0 1 18 0v6" stroke="#fff" stroke-width="4" fill="none"/>
        <circle cx="62" cy="49" r="3" fill="#0a56e8"/>
        <rect x="60.7" y="50" width="2.6" height="7" rx="1.3" fill="#0a56e8"/>
      </svg>
      <h1>Verifica tu identidad</h1>
      <p>Ingresa el código de verificación enviado a tu correo electrónico.</p>
    </header>

    <nav class="tabs"><span class="tab">Verificación OTP</span></nav>

    <section class="body">
      <p class="lead">Hemos enviado un código de 6 dígitos a tu correo</p>

      <div class="otp" id="otp">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1" autofocus>
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6">
      </div>

      <p class="msg" id="msg" role="status"></p>

      <button class="btn" id="verifyBtn" type="button">
        Verificar código
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z" fill="#fff"/>
          <path d="m8.5 12 2.5 2.5 4.5-5" stroke="#1a63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <p class="resend">¿No recibiste el código?<button type="button" id="resendBtn">Reenviar código</button></p>

      <div class="timer">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="timerText">El código vence en 5:00 minutos</span>
        </span>
      </div>
    </section>
  </main>

<script>
(function () {
  const OTP_SECONDS = 300;
  const boxes = Array.from(document.querySelectorAll("#otp input"));
  const otpWrap = document.getElementById("otp");
  const msg = document.getElementById("msg");
  const verifyBtn = document.getElementById("verifyBtn");
  const resendBtn = document.getElementById("resendBtn");
  const timerText = document.getElementById("timerText");
  let remaining = OTP_SECONDS;
  let tick;
  let verifying = false;

  function setMsg(text, type) {
    msg.textContent = text || "";
    msg.className = "msg" + (type ? " " + type : "");
  }
  function getCode() { return boxes.map(b => b.value).join(""); }
  function clearBoxes() {
    boxes.forEach(b => { b.value = ""; b.classList.remove("filled"); });
    boxes[0].focus();
  }
  function showError(text) {
    setMsg(text, "err");
    otpWrap.classList.add("error", "shake");
    setTimeout(() => otpWrap.classList.remove("shake"), 400);
  }

  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/\D/g, "").slice(-1);
      box.classList.toggle("filled", !!box.value);
      otpWrap.classList.remove("error");
      setMsg("");
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) {
        boxes[i - 1].value = "";
        boxes[i - 1].classList.remove("filled");
        boxes[i - 1].focus();
      } else if (e.key === "ArrowLeft" && i > 0) {
        boxes[i - 1].focus();
      } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
        boxes[i + 1].focus();
      } else if (e.key === "Enter") {
        verify();
      }
    });
    box.addEventListener("focus", () => box.select());
    box.addEventListener("paste", (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, boxes.length);
      digits.split("").forEach((d, k) => { boxes[k].value = d; boxes[k].classList.add("filled"); });
      boxes[Math.min(digits.length, boxes.length - 1)].focus();
    });
  });

  // ---- countdown ----
  function renderTimer() {
    const m = Math.floor(remaining / 60);
    const s = String(remaining % 60).padStart(2, "0");
    timerText.textContent = remaining > 0
      ? "El código vence en " + m + ":" + s + " minutos"
      : "El código ha vencido. Solicita uno nuevo.";
  }
  function startTimer() {
    clearInterval(tick);
    remaining = OTP_SECONDS;
    renderTimer();
    verifyBtn.disabled = false;
    tick = setInterval(() => {
      remaining--;
      renderTimer();
      if (remaining <= 0) { clearInterval(tick); verifyBtn.disabled = true; }
    }, 1000);
  }

  // ---- verify ----
  async function verify() {
    if (verifying) return;
    const code = getCode();
    if (code.length < boxes.length) { showError("Ingresa los 6 dígitos del código."); return; }
    verifying = true;
    verifyBtn.disabled = true;
    try {
      const res = await fetch("/verifyOtp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ otp: code })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.success) {
        // Dashboards in keys ko padhte hain
        if (data.role) localStorage.setItem("role", data.role);
        if (data.user) localStorage.setItem("user", JSON.stringify(data.user));

        // staff_dashboard.html "staffName" key padhta hai
        if (data.role === "staff" && data.user) {
          localStorage.setItem("staffName", data.user.fullName || "");
        } else {
          localStorage.removeItem("staffName");
        }

        setMsg("Código verificado correctamente.", "ok");
        window.location.href = data.redirect || "/";
        return; // button disabled rahe, redirect ho raha hai
      }

      // Session expire ho gayi -> login par bhejo
      if (res.status === 401 && data.redirect) {
        window.location.href = data.redirect;
        return;
      }

      showError(data.message || "Código incorrecto. Inténtalo de nuevo.");
      clearBoxes();
      verifyBtn.disabled = remaining <= 0;
    } catch (err) {
      showError("No se pudo conectar con el servidor.");
      verifyBtn.disabled = false;
    }
    verifying = false;
  }
  verifyBtn.addEventListener("click", verify);

  // ---- resend ----
  resendBtn.addEventListener("click", async () => {
    resendBtn.disabled = true;
    try {
      const res = await fetch("/resendOtp", { method: "POST", credentials: "same-origin" });
      const data = await res.json().catch(() => ({}));

      if (res.status === 401 && data.redirect) {
        window.location.href = data.redirect;
        return;
      }

      if (res.ok && data.success !== false) {
        clearBoxes();
        otpWrap.classList.remove("error");
        setMsg("Te enviamos un nuevo código.", "ok");
        startTimer();
      } else {
        showError(data.message || "No se pudo reenviar el código.");
      }
    } catch (err) {
      showError("No se pudo conectar con el servidor.");
    }
    setTimeout(() => { resendBtn.disabled = false; }, 30000); // 30s cooldown
  });

  startTimer();
})();
</script>
</body>
</html>
