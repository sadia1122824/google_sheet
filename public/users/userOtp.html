.panel{
  display:flex;align-items:center;justify-content:center;padding:32px 40px;
  background:linear-gradient(180deg,#f1f4fb 0%,#edf0f8 100%);
}
.card{
  width:100%;max-width:400px;background:var(--card);border-radius:20px;
  padding:40px 34px 30px;text-align:center;
  box-shadow:0 18px 50px rgba(30,50,100,.10),0 2px 8px rgba(30,50,100,.05);
}
h1{margin:0;font-size:1.75rem;line-height:1.15;font-weight:700;color:var(--title);letter-spacing:-.01em}
.sub{margin:18px auto 0;font-size:1rem;line-height:1.5;color:var(--text);max-width:290px}
.otp{display:flex;justify-content:space-between;gap:7px;margin-top:24px}
.otp input{
  width:100%;min-width:0;aspect-ratio:46/52;max-width:46px;text-align:center;
  font:600 1.25rem 'Inter',system-ui,sans-serif;color:var(--title);
  background:#fff;border:1.5px solid var(--border);border-radius:10px;outline:none;
  transition:border-color .15s, box-shadow .15s;caret-color:var(--blue);
}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,108,242,.18)}
.otp.error input{border-color:#d93a3a}
.btn{
  display:block;width:100%;margin-top:24px;height:46px;border:0;border-radius:8px;
  background:var(--blue);color:#fff;font:600 1rem 'Inter',system-ui,sans-serif;cursor:pointer;
  transition:background .15s;
}
.btn:hover{background:var(--blue-hover)}
.btn:focus-visible,.link:focus-visible{outline:3px solid rgba(10,108,242,.4);outline-offset:3px}
.btn:disabled{background:var(--disabled);cursor:not-allowed}
.nocode{margin:24px 0 0;font-size:.9rem;color:var(--muted)}
.resend{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;font-size:.9rem}
.link{background:none;border:0;padding:0;font:500 .9rem 'Inter',system-ui,sans-serif;color:var(--blue);cursor:pointer;text-decoration:none}
.link:disabled{cursor:default;opacity:1}
.sep{width:1.5px;height:18px;background:#5b6577}
.timer{color:var(--muted);font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:30px}
.back svg{width:16px;height:16px}
.msg{min-height:0;margin-top:12px;font-size:.95rem;color:#d93a3a}
.msg.ok{color:#1a8f4c}
@media (max-width:900px){
  .page{grid-template-columns:1fr;grid-template-rows:220px 1fr}
  .panel{padding:24px 16px 40px;align-items:flex-start}
  .card{padding:40px 24px 32px;margin-top:-60px;position:relative}
  h1{font-size:1.9rem}
  .sub{font-size:1.05rem}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){}
}
</style>
</head>
<body>
<main class="page">
  <div class="photo" role="img" aria-label="Persona usando una calculadora y una laptop con informes financieros"></div>
  <section class="panel">
    <div class="card">
      <h1>Verificación OTP</h1>
      <p class="sub">Hemos enviado un código de verificación a tu correo electrónico</p>

      <div class="otp" id="otp" role="group" aria-label="Código de verificación de 6 dígitos">
        <input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 2">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 3">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 4">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 5">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 6">
      </div>

      <button class="btn" id="verify" type="button">Verificar código</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <p class="nocode">¿No recibiste el código?</p>
      <div class="resend">
        <button class="link" id="resend" type="button" disabled>Reenviar código</button>
        <span class="sep" aria-hidden="true"></span>
        <span class="timer" id="timer">00:30</span>
      </div>

      <a class="link back" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Volver al inicio de sesión
      </a>
    </div>
  </section>
</main>
<script>
  const msg = document.getElementById("msg");
  const inputs = [...document.querySelectorAll("#otp input")];
  const otpBox = document.getElementById("otp");
  const verifyBtn = document.getElementById("verify");
  const resendBtn = document.getElementById("resend");
  const timerEl = document.getElementById("timer");

  function showMsg(text, ok = false) {
    msg.textContent = text;
    msg.className = "msg" + (ok ? " ok" : "");
  }

  // ---- OTP inputs: auto-move, backspace, paste ----
  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      otpBox.classList.remove("error");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
      if (e.key === "Enter") verifyBtn.click();
    });

    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
      digits.split("").forEach((d, idx) => (inputs[idx].value = d));
      inputs[Math.min(digits.length, 5)].focus();
    });
  });

  const getOtp = () => inputs.map((i) => i.value).join("");

  // ---- Verify ----
  verifyBtn.addEventListener("click", async () => {
    const otp = getOtp();
    if (otp.length !== 6) {
      otpBox.classList.add("error");
      return showMsg("Ingresa los 6 dígitos del código");
    }

    verifyBtn.disabled = true;
    try {
      const res = await fetch("/api/client/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ otp }),
      });
      const data = await res.json();

      if (data.success) {
        showMsg(data.message, true);
        window.location.href = data.redirect;
      } else {
        otpBox.classList.add("error");
        showMsg(data.message);
        verifyBtn.disabled = false;
      }
    } catch (err) {
      showMsg("Error de red, intenta de nuevo");
      verifyBtn.disabled = false;
    }
  });

  // ---- Resend timer ----
  let timerId;
  function startTimer(seconds = 30) {
    let left = seconds;
    resendBtn.disabled = true;
    clearInterval(timerId);
    const tick = () => {
      const m = String(Math.floor(left / 60)).padStart(2, "0");
      const s = String(left % 60).padStart(2, "0");
      timerEl.textContent = `${m}:${s}`;
      if (left-- <= 0) {
        clearInterval(timerId);
        resendBtn.disabled = false;
      }
    };
    tick();
    timerId = setInterval(tick, 1000);
  }
  startTimer();

  resendBtn.addEventListener("click", async () => {
    resendBtn.disabled = true;
    try {
      const res = await fetch("/api/client/resend-otp", {
        method: "POST",
        credentials: "include",
      });
      const data = await res.json();
      showMsg(data.message, data.success);
      if (data.success) {
        inputs.forEach((i) => (i.value = ""));
        inputs[0].focus();
        startTimer();
      } else {
        resendBtn.disabled = false;
      }
    } catch (err) {
      showMsg("Error de red, intenta de nuevo");
      resendBtn.disabled = false;
    }
  });

  inputs[0].focus();
</script>
</body>
</html>
